linters:
  disable:
    - exhaustruct
    - gochecknoglobals
    - gochecknoinits
    - interfacebloat
    - gomoddirectives
    - lll
    - godot
    - tagalign
    - godox
    - depguard
    - funlen
    - gocognit
    - gosec
    - nestif
    - noinlineerr
    - cyclop
    - err1

linters-settings:
  revive:
    rules:
      - name: package-comments
        disabled: true
